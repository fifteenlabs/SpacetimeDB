[package]
name = "spacetimedb-sdk"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "A Rust SDK for clients to interface with SpacetimeDB"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# `native-tls` stays on by default so this is not a breaking change; a crate
# that wants a pure-Rust build opts out:
#
#     spacetimedb-sdk = { version = "2", default-features = false, features = ["rustls"] }
#
# Depending on OpenSSL is not only a build-time cost. An application that also
# links BoringSSL — anything using libsignal, for instance — ends up with two
# TLS implementations exporting the same symbols, and an `SSL` allocated by one
# reaching the other's `SSL_ctrl` segfaults.
default = ["native-tls"]
native-tls = ["dep:native-tls", "tokio-tungstenite/native-tls"]
rustls = ["tokio-tungstenite/rustls-tls-webpki-roots"]
allow_loopback_http_for_tests = ["spacetimedb-testing/allow_loopback_http_for_tests"]
browser = [
    "dep:getrandom",
    "dep:gloo-console",
    "dep:gloo-net",
    "dep:gloo-storage",
    "dep:gloo-utils",
    "dep:js-sys",
    "dep:tokio-tungstenite-wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
spacetimedb-data-structures.workspace = true
spacetimedb-sats.workspace = true
spacetimedb-lib = { workspace = true, features = ["serde", "metrics_impls"]}
spacetimedb-client-api-messages.workspace = true
spacetimedb-metrics.workspace = true
spacetimedb-query-builder.workspace = true
spacetimedb-schema.workspace = true

thiserror.workspace = true
anymap3 = "1.0.1"
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
futures.workspace = true
futures-channel.workspace = true
http.workspace = true
log.workspace = true
once_cell.workspace = true
prometheus.workspace = true
rand.workspace = true

getrandom = { version = "0.3.4", features = ["wasm_js"], optional = true }
gloo-console = { version = "0.3.0", optional = true }
gloo-net = { version = "0.6.0", optional = true }
gloo-storage = { version = "0.3.0", optional = true }
gloo-utils = { version = "0.2.0", optional = true }
js-sys = { version = "0.3", optional = true }
tokio-tungstenite-wasm = { version = "0.6.0", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.45", optional = true }
web-sys = { version = "0.3.77", features = ["HtmlDocument"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
home.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
# Not referenced from the source — kept only so the pin below still applies
# when the `native-tls` feature selects that backend for tokio-tungstenite.
#
# native-tls 0.2.17 fails to compile with Rust 1.93.0 due non-exhaustive
# matching in upstream code. Pin until upstream ships a compatible release.
native-tls = { version = "=0.2.14", optional = true }

[dev-dependencies]
# for quickstart-chat and cursive-chat examples
hex.workspace = true
# for cursive-chat example
cursive.workspace = true
futures-channel.workspace = true
shlex = "1.3.0"

# for tests
spacetimedb-testing = { path = "../../crates/testing" }

[lints]
workspace = true
